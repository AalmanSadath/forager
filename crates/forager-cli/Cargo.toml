[package]
name = "forager-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Install and update Linux apps from their GitHub releases"

[[bin]]
name = "forager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
forager-core = { version = "0.2.0", path = "../forager-core" }
notify-rust = "4.18.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
