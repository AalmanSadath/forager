[package]
name = "forager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Release tracking and installation core for Forager"

[dependencies]
backhand = { version = "0.25.5", default-features = false, features = ["xz", "gzip", "zstd", "lz4"] }
base64 = "0.23.1"
dirs = "7.0.0"
hex = "0.4.3"
minisign-verify = "0.3.0"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }
url = "2.5.8"
zbus = "5"

[dev-dependencies]
tempfile = "3.27.0"
